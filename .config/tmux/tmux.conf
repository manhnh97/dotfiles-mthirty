# Keyboard-first terminal panes. Prefix is Ctrl-a.
set -g prefix C-a
unbind C-b
bind C-a send-prefix

# Esc stays with Vim. A non-zero escape-time makes Vim feel late.
set -s escape-time 0
set -g focus-events on
set -g history-limit 50000
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
# A drag copies the selection. Double-click copies a word, triple-click a line.
set -g mouse on
setw -g mode-keys vi
set -g status-interval 5
set -g display-time 2000
set -g repeat-time 300

bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %
bind c new-window -c "#{pane_current_path}"

bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Apple Terminal drops OSC 52, so a copy has to go through pbcopy.
# Enter, y, and a mouse release all use this when the pipe has no command.
if-shell 'command -v pbcopy >/dev/null 2>&1' 'set -s copy-command pbcopy'

bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe-and-cancel
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel

bind s choose-tree -sZ -O name

set -g status-style "bg=colour235,fg=colour250"
set -g status-left " #S "
set -g status-left-length 24
set -g status-right " #{?client_prefix,PREFIX ,}%H:%M "
set -g pane-border-style "fg=colour238"
set -g pane-active-border-style "fg=colour75"
